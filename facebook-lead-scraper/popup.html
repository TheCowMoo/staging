<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Lead Scraper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1877F2" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
          <path d="M11 8v6"/>
          <path d="M8 11h6"/>
        </svg>
        <h1>FB Lead Scraper</h1>
      </div>
      <span id="mode-badge" class="badge badge-idle">Idle</span>
    </header>

    <!-- Status Bar -->
    <div id="status-bar" class="status-bar">
      <span id="status-text">Ready</span>
      <span id="counter-text">0 leads</span>
    </div>

    <!-- Mode Detection -->
    <div id="mode-section" class="card">
      <div class="card-title">Page Detection</div>
      <div id="detected-mode" class="detected-mode">
        <span class="mode-icon">🔍</span>
        <span id="mode-description">Detecting page type...</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="btn-start" class="btn btn-primary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        Start Scraping
      </button>
      <button id="btn-stop" class="btn btn-danger" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
        </svg>
        Stop
      </button>
    </div>

    <!-- Progress -->
    <div id="progress-container" class="card hidden">
      <div class="card-title">Progress</div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="progress-details">
        <span id="progress-count">0</span> leads collected
        <span id="progress-batch" class="batch-info">Batch: 0</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button id="btn-export" class="btn btn-secondary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export CSV
      </button>
      <button id="btn-clear" class="btn btn-ghost" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
        Clear
      </button>
    </div>

    <!-- Leads Preview Table -->
    <div id="preview-section" class="card">
      <div class="card-title">Latest Leads <span id="preview-count" class="badge badge-count">0</span></div>
      <div id="preview-container" class="table-container">
        <table id="leads-table" class="leads-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="leads-tbody">
            <tr id="empty-row">
              <td colspan="4" class="empty-state">No leads yet. Start scraping!</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
      <a href="#" id="open-github" class="footer-link">About</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
